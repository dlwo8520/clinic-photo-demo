# Exactly one service. The paid compute plan is required for a persistent disk.
services:
  - type: web
    name: clinic-photo-demo
    runtime: python
    plan: 1c-2g
    region: singapore
    numInstances: 1
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /healthz/
    disk:
      name: clinic-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DJANGO_DEBUG
        value: "0"
      - key: CLINIC_DATA_DIR
        value: /var/data/clinic
      - key: CLINIC_SEED_DEMO
        value: "1"
      - key: DJANGO_SECRET_KEY
        sync: false
      # Build/start export the actual RENDER_EXTERNAL_URL and hostname as
      # QR_BASE_URL and DJANGO_ALLOWED_HOSTS. No localhost fallback in production.
      - key: CLINIC_DEMO_PASSWORD
        sync: false
