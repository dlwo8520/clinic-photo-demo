# Free interview demo: no paid service and no persistent disk.
services:
  - type: web
    name: clinic-photo-demo
    runtime: python
    plan: free
    region: singapore
    numInstances: 1
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DJANGO_DEBUG
        value: "0"
      - key: CLINIC_DATA_DIR
        value: /tmp/clinic-photo-demo
      - key: CLINIC_STORAGE_MODE
        value: ephemeral
      - key: CLINIC_DEMO_LOGIN
        value: "1"
      - key: CLINIC_SEED_DEMO
        value: "1"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Build/start export the actual RENDER_EXTERNAL_URL and hostname as
      # QR_BASE_URL and DJANGO_ALLOWED_HOSTS. No localhost fallback in production.
